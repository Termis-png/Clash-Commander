
name: Build Clash Commander APK

on:
  workflow_dispatch:
  push:
    branches: [main, Elixir-defense]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'sdk.dir=%s\nGEMINI_API_KEY=%s\n' "$ANDROID_HOME" "$GEMINI_API_KEY" > local.properties

      - name: Download speech engine
        run: bash scripts/bootstrap_sherpa_deps.sh

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-commander-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
